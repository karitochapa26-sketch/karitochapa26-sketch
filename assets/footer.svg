<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <style>
    
    @keyframes ceTwinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    @keyframes ceReveal { 0%, 5% { opacity: 0; transform: translateY(6px); } 18%, 90% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } }
    @keyframes ceWipe { 0%, 8% { transform: scaleX(0); } 24%, 90% { transform: scaleX(1); } 100% { transform: scaleX(1); } }

    
    .ce-div { animation: ceReveal 13s ease-out infinite; }
    .ce-eyebrow { animation: ceReveal 13s ease-out infinite; animation-delay: 0.78s; }
    .ce-name { animation: ceReveal 13s ease-out infinite; animation-delay: 1.56s; }
    .ce-socials { animation: ceReveal 13s ease-out infinite; animation-delay: 2.60s; }
    .ce-credit { animation: ceReveal 13s ease-out infinite; animation-delay: 3.64s; }
    
  </style>

