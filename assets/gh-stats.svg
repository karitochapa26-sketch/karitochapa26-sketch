  <!-- contribution total -->
  <g class="ce-total">
    <text x="400" y="272" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"><tspan fill="#eef2fb" font-size="16" font-weight="700">—</tspan><tspan fill="#c7a8ff" font-size="12" letter-spacing="1"> contributions in the past year</tspan></text>
  </g>
</svg>