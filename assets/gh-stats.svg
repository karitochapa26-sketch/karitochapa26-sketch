  <circle cx="369" cy="292" r="1.25" fill="#eef2fb" opacity="0.39" style="animation: ceTwinkle 3.53s ease-in-out 2.91s infinite"/>
  <circle cx="167" cy="290" r="1.52" fill="#eef2fb" opacity="0.35" style="animation: ceTwinkle 2.98s ease-in-out 2.49s infinite"/>
