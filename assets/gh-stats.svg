  <circle cx="675" cy="296" r="1.48" fill="#eef2fb" opacity="0.54" style="animation: ceTwinkle 3.44s ease-in-out 1.05s infinite"/>
  <rect width="800" height="300" fill="url(#ceVig)"/>

  <!-- eyebrow -->
  <g class="ce-eyebrow">
    <path d="M 54 51 L 55.3 54.7 L 59 56 L 55.3 57.3 L 54 61 L 52.7 57.3 L 49 56 L 52.7 54.7 Z" fill="#eb6a00"/>
    <text x="70" y="61" fill="#eb6a00" font-family="Georgia, 'Times New Roman', serif" font-size="12" letter-spacing="3.5">OBSERVATORY LOG</text>
    <text x="752" y="61" text-anchor="end" fill="#c7a8ff" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="1.5">@GITHUB-USER</text>
  </g>
  <rect class="ce-rule" x="48" y="74" width="704" height="1" fill="#eb6a00" opacity="0.5"/>

  <!-- stat cards -->
  <g class="ce-card ce-card-0">
      <path d="M 51 92.5 L 51.91 95.09 L 54.5 96 L 51.91 96.91 L 51 99.5 L 50.09 96.91 L 47.5 96 L 50.09 95.09 Z" fill="#eb6a00"/>
      <text x="48" y="124" fill="#eef2fb" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700">—</text>
      <text x="49" y="144" fill="#eb6a00" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="2">REPOS</text>
