<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <style>
    
    @keyframes ceTwinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    @keyframes ceReveal { 0%, 5% { opacity: 0; transform: translateY(6px); } 18%, 90% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } }
    @keyframes ceWipe { 0%, 8% { transform: scaleX(0); } 24%, 90% { transform: scaleX(1); } 100% { transform: scaleX(1); } }

    
    .ce-eyebrow { animation: ceReveal 13s ease-out infinite; }
    .ce-rule { animation: ceWipe 13s ease-out infinite; transform-box: fill-box; transform-origin: left center; animation-delay: 0.78s; }
    .ce-card { animation: ceReveal 13s ease-out infinite; }
    .ce-card-0 { animation-delay: 1.56s; }
    .ce-card-1 { animation-delay: 2.08s; }
    .ce-card-2 { animation-delay: 2.60s; }
    .ce-card-3 { animation-delay: 3.12s; }
    .ce-bar { animation: ceReveal 13s ease-out infinite; animation-delay: 3.64s; }
    .ce-leg { animation: ceReveal 13s ease-out infinite; animation-delay: 4.16s; }
    .ce-total { animation: ceReveal 13s ease-out infinite; animation-delay: 4.94s; }
    
  </style>

  <defs>
    <linearGradient id="ceSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a263f"/>
      <stop offset="0.55" stop-color="#230d28"/>
      <stop offset="1" stop-color="#120715"/>
    </linearGradient>
    <radialGradient id="ceVig" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>
  <rect width="800" height="300" fill="url(#ceSky)"/>
  <circle cx="743" cy="298" r="1.01" fill="#eef2fb" opacity="0.74" style="animation: ceTwinkle 3.65s ease-in-out 2.18s infinite"/>
  <circle cx="495" cy="283" r="0.46" fill="#eef2fb" opacity="0.34" style="animation: ceTwinkle 3.75s ease-in-out 1.31s infinite"/>
