  <!-- language spectrum -->
  <text class="ce-bar" x="48" y="194" fill="#c7a8ff" font-family="Georgia, 'Times New Roman', serif" font-size="10" letter-spacing="2">LANGUAGE SPECTRUM</text>
  <g class="ce-bar"><rect x="48" y="206" width="704" height="10" rx="5" fill="#eb6a00" fill-opacity="0.18"/></g>
  <g class="ce-leg"><g><rect x="48" y="228" width="9" height="9" fill="#c7a8ff"/>
