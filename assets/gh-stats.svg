  <circle cx="669" cy="192" r="0.68" fill="#eef2fb" opacity="0.68" style="animation: ceTwinkle 2.19s ease-in-out 2.84s infinite"/>
  <circle cx="37" cy="63" r="0.66" fill="#eef2fb" opacity="0.77" style="animation: ceTwinkle 3.56s ease-in-out 2.17s infinite"/>
  <circle cx="574" cy="175" r="0.74" fill="#eef2fb" opacity="0.73" style="animation: ceTwinkle 3.25s ease-in-out 2.91s infinite"/>
  <circle cx="51" cy="176" r="1.35" fill="#eb6a00" opacity="0.43" style="animation: ceTwinkle 3.14s ease-in-out 0.12s infinite"/>
