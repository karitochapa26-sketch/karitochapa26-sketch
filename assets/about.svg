<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <style>
    
    @keyframes ceTwinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    @keyframes ceReveal { 0%, 5% { opacity: 0; transform: translateY(6px); } 18%, 90% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } }
    @keyframes ceWipe { 0%, 8% { transform: scaleX(0); } 24%, 90% { transform: scaleX(1); } 100% { transform: scaleX(1); } }

    
    .ce-eyebrow { animation: ceReveal 13s ease-out infinite; }
    .ce-rule { animation: ceWipe 13s ease-out infinite; transform-box: fill-box; transform-origin: left center; animation-delay: 0.78s; }
    .ce-bio { animation: ceReveal 13s ease-out infinite; }
    .ce-bio-0 { animation-delay: 1.82s; }
    .ce-bio-1 { animation-delay: 2.34s; }
    .ce-bio-2 { animation-delay: 2.86s; }
    .ce-bio-3 { animation-delay: 3.38s; }
    .ce-meta { animation: ceReveal 13s ease-out infinite; animation-delay: 4.42s; }
    
  </style>

  <defs>
