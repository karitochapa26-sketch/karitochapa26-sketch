<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320">
  <defs>
    <linearGradient id="ceSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a263f"/>
      <stop offset="0.55" stop-color="#230d28"/>
      <stop offset="1" stop-color="#120715"/>
    </linearGradient>
    <radialGradient id="ceVig" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>
  <style>
    @keyframes ceTwinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    @keyframes ceDraw { 0%, 12% { stroke-dashoffset: var(--l, 100); } 34%, 90% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; } }
    .ce-star-div { transform-box: fill-box; transform-origin: center; animation: ceStar 13s linear infinite; }
    @keyframes ceStar { to { transform: rotate(360deg); } }
    
    .ce-eyebrow { animation: ceReveal 13s ease-out infinite; }
    .ce-name { animation: ceReveal 13s ease-out infinite; animation-delay: 1.04s; }
    .ce-div { animation: ceWipe 13s ease-out infinite; transform-box: fill-box; transform-origin: left center; animation-delay: 1.82s; }
    .ce-deck { animation: ceReveal 13s ease-out infinite; }
    .ce-deck-0 { animation-delay: 2.60s; }
    .ce-deck-1 { animation-delay: 3.12s; }
    .ce-meta { animation: ceReveal 13s ease-out infinite; animation-delay: 3.90s; }
    
    @keyframes ceReveal { 0%, 5% { opacity: 0; transform: translateY(5px); } 18%, 90% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } }
    @keyframes ceWipe { 0%, 8% { transform: scaleX(0); } 24%, 90% { transform: scaleX(1); } 100% { transform: scaleX(1); } }
  </style>

  <rect width="800" height="320" fill="url(#ceSky)"/>

