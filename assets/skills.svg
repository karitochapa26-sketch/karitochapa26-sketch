  <style>
    
    @keyframes ceTwinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    @keyframes ceReveal { 0%, 5% { opacity: 0; transform: translateY(6px); } 18%, 90% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } }
    @keyframes ceWipe { 0%, 8% { transform: scaleX(0); } 24%, 90% { transform: scaleX(1); } 100% { transform: scaleX(1); } }

    
    .ce-eyebrow { animation: ceReveal 13s ease-out infinite; }
    .ce-count { animation: ceReveal 13s ease-out infinite; animation-delay: 1.30s; }
    .ce-rule { animation: ceWipe 13s ease-out infinite; transform-box: fill-box; transform-origin: left center; animation-delay: 0.78s; }
    .ce-row { animation: ceReveal 13s ease-out infinite; }
    .ce-row-0 { animation-delay: 1.56s; }
    .ce-row-1 { animation-delay: 1.95s; }
    .ce-row-2 { animation-delay: 2.34s; }
    .ce-row-3 { animation-delay: 2.73s; }
    .ce-row-4 { animation-delay: 3.12s; }
    .ce-row-5 { animation-delay: 3.51s; }
    .ce-row-6 { animation-delay: 3.90s; }
    .ce-row-7 { animation-delay: 4.29s; }
    .ce-row-8 { animation-delay: 4.68s; }
    .ce-row-9 { animation-delay: 5.07s; }
    .ce-row-10 { animation-delay: 5.46s; }
    .ce-row-11 { animation-delay: 5.85s; }
    
  </style>

